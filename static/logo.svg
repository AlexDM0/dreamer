<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 80" width="272" height="80">
  <title>Dreamer</title>
  <!-- Mark (same art as favicon.svg) plus the "Dreamer" wordmark in the system sans.
       The wordmark follows the viewer's light/dark preference. -->
  <style>
    .word { fill: #1c1a18; }
    @media (prefers-color-scheme: dark) { .word { fill: #f7f5f2; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a6ef0"/>
      <stop offset="1" stop-color="#4134ae"/>
    </linearGradient>
    <mask id="crescent" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="64" cy="45" r="40" fill="#000"/>
    </mask>
  </defs>

  <g transform="scale(0.625)">
    <rect width="128" height="128" rx="28" fill="url(#sky)"/>
    <circle cx="27" cy="27" r="2.6" fill="#fff8ee" opacity="0.55"/>
    <circle cx="44" cy="17" r="1.8" fill="#fff8ee" opacity="0.4"/>
    <circle cx="64" cy="60" r="44" fill="#fde9c4" mask="url(#crescent)"/>
    <circle cx="56" cy="67" r="17" fill="#fff8ee" stroke="#4b3bc6" stroke-width="3.5"/>
    <path d="M47.5 67.5q3 3.4 6 0M58.5 67.5q3 3.4 6 0" fill="none" stroke="#2a2550"
          stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="47" cy="74" r="2.4" fill="#f28b84" opacity="0.6"/>
    <circle cx="66" cy="74" r="2.4" fill="#f28b84" opacity="0.6"/>
    <circle cx="76" cy="46" r="3" fill="#fff8ee"/>
    <circle cx="84" cy="36.5" r="4.2" fill="#fff8ee"/>
    <path d="M100 11 C101.6 20 104 22.4 113 24 C104 25.6 101.6 28 100 37 C98.4 28 96 25.6 87 24 C96 22.4 98.4 20 100 11 Z"
          fill="#f5b53d"/>
  </g>

  <text class="word" x="98" y="54" font-size="40" font-weight="650" letter-spacing="-0.8"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">Dreamer</text>
</svg>
