<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dreamer">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#f7f5f2">
  <title>Dreamer</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="toolbar" aria-label="Drawing tools">
      <div class="row tools">
        <span class="brand">
          <img class="mark" src="/static/favicon.svg" alt="Dreamer" width="52" height="52">
          <span class="conn" id="conn" data-state="off" role="status" aria-label="Not connected" title="Not connected"></span>
        </span>

        <div class="group swatches" id="swatches" role="radiogroup" aria-label="Colours"></div>

        <div class="group brush">
          <span class="brush-preview" id="brush-preview" aria-hidden="true"><span></span></span>
          <input type="range" id="brush-size" min="4" max="40" step="1" value="12" aria-label="Brush size">
        </div>

        <button type="button" class="tile clear" id="clear" aria-label="Clear the drawing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 4h4M7 7l1 13h8l1-13M10.5 11v5.5M13.5 11v5.5"/></svg>
          <span>Clear</span>
        </button>

        <div class="group modes" id="modes" role="radiogroup" aria-label="What to show">
          <button type="button" class="mode" data-mode="auto" aria-label="Auto">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 15 9M13 7l4 4M17 3v3M15.5 4.5h3M20 8v2M19 9h2M8 3v2M7 4h2"/></svg>
            <span>Auto</span>
          </button>
          <button type="button" class="mode" data-mode="sketch" aria-label="Sketch">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg>
            <span>Sketch</span>
          </button>
          <button type="button" class="mode" data-mode="picture" aria-label="Picture">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M4 17l5-5 4 4 2.5-2.5L20 18"/><circle cx="15.5" cy="9" r="1.6"/></svg>
            <span>Picture</span>
          </button>
          <button type="button" class="mode" data-mode="split" aria-label="Side by side">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="7.5" height="14" rx="2"/><rect x="13.5" y="5" width="7.5" height="14" rx="2"/></svg>
            <span>Both</span>
          </button>
        </div>

        <!-- Only shown while the tools are tucked away: brings them all back. -->
        <button type="button" class="tool-toggle" id="expand" aria-label="Show all tools" aria-controls="picks" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5h6v6M9.5 20.5h-6v-6M20.5 3.5l-6.5 6.5M3.5 20.5l6.5-6.5"/></svg>
        </button>

      </div>

      <div class="row picks" id="picks">
        <div class="pick-row" id="topics" aria-label="Pick a world"></div>
        <div class="pick-row" id="styles" aria-label="Pick a style"></div>
        <!-- Tuck the tools away: only the colours and the brush size stay. -->
        <button type="button" class="tool-toggle" id="minimise" aria-label="Make the drawing bigger" aria-controls="picks" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l6.5-6.5M3.5 20.5L10 14"/></svg>
        </button>
      </div>
    </header>

    <div class="work">
      <main class="stage-wrap" id="stage-wrap">
        <div class="stage mode-auto" id="stage">
          <div class="pane pane-picture"><canvas id="picture" width="640" height="448" aria-label="Your dream picture"></canvas></div>
          <div class="pane pane-sketch"><canvas id="sketch" width="640" height="448" aria-label="Drawing area"></canvas></div>
        </div>
        <div class="hint" id="hint" role="status" aria-live="polite" hidden>
          <span class="hint-text" id="hint-text"></span>
          <button type="button" class="hint-btn" id="hint-btn" hidden></button>
        </div>
      </main>

      <nav class="side" aria-label="My pictures">
        <button type="button" class="side-btn save" id="save" aria-label="Save this picture">
          <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.2 1.03 6L12 17l-5.38 2.8 1.03-6L3.3 9.6l6-.9z"/></svg></span>
          <span class="side-label" id="save-label">Save</span>
        </button>
        <button type="button" class="side-btn gallery-btn" id="open-gallery" aria-label="My pictures">
          <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="13.5" height="13.5" rx="2.5"/><path d="M7.5 3.5h10.5a2.5 2.5 0 0 1 2.5 2.5v10.5M6 18l3.4-3.6 2.4 2.4 1.7-1.7 2.5 2.6"/><circle cx="13" cy="11" r="1.4"/></svg></span>
          <span class="side-label">Gallery</span>
        </button>
        <button type="button" class="side-btn new" id="new-drawing" aria-label="Start a new drawing">
          <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8.5l4 4v13H6zM14.5 3.5v4h4M12.25 10.5v7M8.75 14h7"/></svg></span>
          <span class="side-label">New</span>
        </button>
        <button type="button" class="side-btn paper" id="paper" aria-label="Change the paper colour" aria-haspopup="dialog">
          <span class="disc"><span class="paper-chip" id="paper-chip" aria-hidden="true"></span></span>
          <span class="side-label">Paper</span>
        </button>
      </nav>
    </div>

    <!-- Gallery: a full-screen grid of saved pictures, and a detail view. -->
    <section class="gallery" id="gallery" aria-label="My pictures" hidden>
      <header class="gallery-bar">
        <button type="button" class="btn ghost back" id="gallery-back" aria-label="Back to drawing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          <span>Draw</span>
        </button>
        <h2>My pictures</h2>
        <span class="bar-spacer" aria-hidden="true"></span>
      </header>
      <div class="gallery-scroll" id="gallery-scroll">
        <div class="grid" id="gallery-grid"></div>
        <div class="gallery-empty" id="gallery-empty" hidden>
          <span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M4 17l5-5 4 4 2.5-2.5L20 18"/><circle cx="15.5" cy="9" r="1.6"/></svg></span>
          <p>No saved pictures yet.</p>
          <p class="sub">Tap the star to keep a picture here.</p>
        </div>
        <div class="gallery-empty" id="gallery-error" role="status" hidden>
          <span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 16.2a5 5 0 0 1 7 0M5 12.6a10 10 0 0 1 4.2-2.4M19 12.6a10 10 0 0 0-3-2M2 9a15 15 0 0 1 4.3-2.8M22 9A15 15 0 0 0 11 5.1M12 19.5h.01"/></svg></span>
          <p>Can't reach your pictures right now.</p>
          <button type="button" class="btn big" id="gallery-retry">Try again</button>
        </div>
        <button type="button" class="btn more" id="gallery-more" hidden>More pictures</button>
      </div>
      <div class="detail" id="detail" hidden>
        <div class="detail-pics">
          <figure><img id="detail-picture" alt="The picture"><figcaption><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3.5l1.8 4.7 4.7 1.8-4.7 1.8L11 16.5l-1.8-4.7L4.5 10l4.7-1.8zM18 14.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg>Picture</figcaption></figure>
          <figure><img id="detail-sketch" alt="The drawing"><figcaption><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg>Drawing</figcaption></figure>
        </div>
        <div class="detail-actions">
          <button type="button" class="btn ghost" id="detail-back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            <span>Back</span>
          </button>
          <button type="button" class="btn big" id="detail-continue">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg>
            <span>Keep drawing</span>
          </button>
        </div>
      </div>
    </section>

    <div class="overlay" id="confirm" hidden>
      <div class="card" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-sub">
        <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.6a2.4 2.4 0 0 1 4.6.9c0 1.6-2.3 2-2.3 3.5M12 16.9h.01"/></svg></span>
        <p id="confirm-title">Start a new drawing?</p>
        <p class="sub" id="confirm-sub">This drawing is not saved yet.</p>
        <div class="card-buttons">
          <button type="button" class="btn ghost" id="confirm-no">Keep this one</button>
          <button type="button" class="btn big" id="confirm-yes">Start new</button>
        </div>
      </div>
    </div>

    <!-- Paper colour: picked for a new drawing, or changed any time (strokes stay). -->
    <div class="overlay" id="bg-picker" hidden>
      <div class="card paper-card" role="dialog" aria-modal="true" aria-labelledby="bg-title">
        <button type="button" class="card-close" id="bg-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <p id="bg-title">Pick your paper</p>
        <div class="paper-grid" id="bg-grid" role="radiogroup" aria-labelledby="bg-title"></div>
      </div>
    </div>

    <div class="overlay" id="replaced" hidden>
      <div class="card">
        <img src="/static/favicon.svg" alt="" width="88" height="88">
        <p>Someone else is drawing on another screen.</p>
        <button type="button" class="btn big" id="take-over">Draw here</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
