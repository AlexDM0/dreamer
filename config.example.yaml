# Dreamer configuration. Copy to config.yaml and edit. Every key is optional.
# Point the SKETCH_CONFIG environment variable at another file to use that instead.

host: 0.0.0.0            # listen on the whole LAN
port: 7860
backend: streamdiffusion  # "streamdiffusion" (needs the RTX GPU setup) or "mock" (no GPU)

# Parent PIN for /admin. CHANGE THIS. Quote it so leading zeros are kept ("0420").
admin_pin: "1234"

# Key used to sign the admin cookie. Leave empty to auto-generate one into data/secret.
secret_key: ""

data_dir: data           # styles.json, params.json, secret, style pictures, gallery (dreamer.db + artworks/)
jpeg_quality: 85         # picture quality sent to the iPad (1-100)
size: 640                # long side of a drawing/picture in pixels (multiple of 64); the
                         # short side is 0.7x (640 -> 640x448, the iPad's shape)
default_view_mode: auto  # auto | sketch | picture | split (kid page default)
kid_theme: dark          # the drawing page's look: dark | light (also switchable on /admin)
mock_delay_ms: 30        # mock backend only: simulated GPU time per frame

model:
  base: stabilityai/sd-turbo
  t_index_list: [6, 26]  # lower first number = more imagination, higher = closer to the sketch
  max_steps: 8            # most steps the admin page can pick
  max_batch_steps: 4      # steps run together (fast, more GPU memory); more run one after another
  refine_steps: 4         # after drawing pauses, refine step by step up to this many steps (0 = off);
                          # 3-5 refines the same picture, above ~6 SD-Turbo starts changing the scene
  upscaler: "off"         # "x2": AI-upscale refined pictures (needs models/realesr-animevideov3.pth)
  controlnet: thibaud/controlnet-sd21-scribble-diffusers  # null disables ControlNet
  controlnet_scale: 0.55     # how strongly the lines shape the picture (0..2)
  line_polarity: white_on_black  # what the ControlNet expects: white_on_black | black_on_white
  engine_dir: engines            # TensorRT engines are built here on first run
  safety_checker: true
  safety_threshold: 0.5
